name: Atleta resale monitor

on:
  # Schedule trigger disabled on request (2026-09-11) -- monitor no longer
  # runs automatically. Re-add a `schedule:` block with a cron expression
  # to turn it back on; workflow_dispatch still works for a manual run.
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Loop duration for this run (seconds). Use a small value for a quick manual test."
        required: false
        default: "17100"

permissions:
  contents: write

concurrency:
  group: atleta-resale-monitor
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      LOOP_BUDGET_SECONDS: ${{ github.event.inputs.duration_seconds || '17100' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against burning private-repo Actions minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_private=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" | jq -r '.private')
          if [ "$is_private" != "false" ]; then
            echo "::error::Repo is still private. This job loops for hours, and GitHub Actions bills every run a minimum of 1 rounded-up minute -- at 30s cadence that's ~43,000 min/month, only free on a public repo. Refusing to run the poll loop. See README.md's one-time setup section."
            exit 1
          fi
          echo "Repo is public, proceeding."

      - name: Poll continuously
        run: bash poller/loop.sh
