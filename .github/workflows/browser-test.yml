name: Browser-based poll test

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Loop duration for this test run (seconds)"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: atleta-resale-monitor-browser-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      LOOP_BUDGET_SECONDS: ${{ github.event.inputs.duration_seconds || '300' }}
      STATE_FILE_NAME: state_browser_test.json
    steps:
      - uses: actions/checkout@v4

      - name: Guard against burning private-repo Actions minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_private=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" | jq -r '.private')
          if [ "$is_private" != "false" ]; then
            echo "::error::Repo is still private. Refusing to run."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run browser-based poll test
        run: python3 poller/browser_loop.py
