name: Atleta resale monitor

on:
  schedule:
    # Restart cadence, not the poll interval. Each run polls continuously
    # every 30s internally (poller/loop.sh) and exits ~5 min before this
    # fires again, so coverage is continuous with a negligible restart gap.
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Loop duration for this run (seconds). Use a small value for a quick manual test."
        required: false
        default: "17100"

permissions:
  contents: write

concurrency:
  group: atleta-resale-monitor
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      LOOP_BUDGET_SECONDS: ${{ github.event.inputs.duration_seconds || '17100' }}
    steps:
      - uses: actions/checkout@v4

      - name: Poll continuously
        run: bash poller/loop.sh
